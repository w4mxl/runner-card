<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 42 47" width="44" height="49">
  <!-- Stopwatch circular body -->
  <circle cx="24" cy="29" r="19" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
  <!-- Flat solid crown top button -->
  <rect x="18" y="4" width="12" height="5.5" rx="1.5" fill="#FFFFFF"/>
  <!-- Sleek hand pointing towards 12:45 -->
  <line x1="24" y1="29" x2="26.5" y2="15" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Center pin dot -->
  <circle cx="24" cy="29" r="2.6" fill="#FFFFFF"/>
</svg>
